<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fable sandbox</title>
    <style>
      body {
        background: #101218;
        color: #e6e8ee;
        font-family: system-ui, sans-serif;
      }
      canvas {
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fable sandbox</h1>
      <canvas id="game" width="640" height="360"></canvas>
      <p>Scheduler updates: <output id="updates">0</output></p>
      <p>Last delta: <output id="delta">0.000</output> seconds</p>
      <button id="toggle" type="button">Pause</button>
    </main>
    <script type="module" src="/source/index.ts"></script>
  </body>
</html>
