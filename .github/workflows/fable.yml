name: Fable

on:
  push:
    paths:
      - 'packages/fable/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/fable.yml'
  pull_request:
    paths:
      - 'packages/fable/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/fable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fable:
    name: Fable checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @dotm4x/fable test

      - name: Type-check
        run: pnpm --filter @dotm4x/fable typecheck

      - name: Build
        run: pnpm --filter @dotm4x/fable build
